name: Database tests

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"

permissions:
  contents: read

concurrency:
  group: fixora-db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Prepare isolated local Supabase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fixora-db-ci
          cd /tmp/fixora-db-ci
          supabase init
          cp "$GITHUB_WORKSPACE/supabase/config.toml" supabase/config.toml
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          cp -R "$GITHUB_WORKSPACE/supabase/migrations" supabase/
          cp -R "$GITHUB_WORKSPACE/supabase/tests" supabase/
          cp -R "$GITHUB_WORKSPACE/supabase/functions" supabase/

      - name: Start isolated local Supabase stack
        working-directory: /tmp/fixora-db-ci
        run: supabase start

      - name: Rebuild database from committed migrations
        working-directory: /tmp/fixora-db-ci
        run: supabase db reset

      - name: Run pgTAP database tests
        working-directory: /tmp/fixora-db-ci
        run: supabase test db

      - name: Prove tenant tests detect a permissive RLS policy
        working-directory: /tmp/fixora-db-ci
        shell: bash
        run: |
          set -euo pipefail
          database_url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$database_url" -v ON_ERROR_STOP=1 -c 'CREATE POLICY "fixora_ci_mutation_allow_all" ON public.fixora_businesses FOR SELECT TO authenticated USING (true)'
          psql "$database_url" -v ON_ERROR_STOP=1 -c 'CREATE POLICY "fixora_ci_mutation_catalog_allow_all" ON public.fixora_catalog_items FOR SELECT TO authenticated USING (true)'
          psql "$database_url" -v ON_ERROR_STOP=1 -c 'CREATE POLICY "fixora_ci_mutation_support_allow_all" ON public.fixora_support_tickets FOR SELECT TO authenticated USING (true)'
          psql "$database_url" -v ON_ERROR_STOP=1 -c 'CREATE POLICY "fixora_ci_mutation_support_messages_allow_all" ON public.fixora_support_messages FOR SELECT TO authenticated USING (true)'
          set +e
          supabase test db
          test_status=$?
          set -e
          psql "$database_url" -v ON_ERROR_STOP=1 -c 'DROP POLICY IF EXISTS "fixora_ci_mutation_allow_all" ON public.fixora_businesses'
          psql "$database_url" -v ON_ERROR_STOP=1 -c 'DROP POLICY IF EXISTS "fixora_ci_mutation_catalog_allow_all" ON public.fixora_catalog_items'
          psql "$database_url" -v ON_ERROR_STOP=1 -c 'DROP POLICY IF EXISTS "fixora_ci_mutation_support_allow_all" ON public.fixora_support_tickets'
          psql "$database_url" -v ON_ERROR_STOP=1 -c 'DROP POLICY IF EXISTS "fixora_ci_mutation_support_messages_allow_all" ON public.fixora_support_messages'
          if [ "$test_status" -eq 0 ]; then
            echo "RLS tests did not detect the intentionally permissive policy."
            exit 1
          fi
          echo "RLS mutation detected: tenant isolation tests failed as expected."
          supabase test db

      - name: Test concurrent license device activation limit
        run: bash scripts/test-license-concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
