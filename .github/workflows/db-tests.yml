name: Database tests

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"

permissions:
  contents: read

concurrency:
  group: fixora-db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Prepare isolated local Supabase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fixora-db-ci
          cd /tmp/fixora-db-ci
          supabase init
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          cp -R "$GITHUB_WORKSPACE/supabase/migrations" supabase/
          cp -R "$GITHUB_WORKSPACE/supabase/tests" supabase/

      - name: Start isolated local Supabase stack
        working-directory: /tmp/fixora-db-ci
        run: supabase start

      - name: Rebuild database from committed migrations
        working-directory: /tmp/fixora-db-ci
        run: supabase db reset

      - name: Run pgTAP database tests
        working-directory: /tmp/fixora-db-ci
        run: supabase test db

      - name: Prove each tenant test detects a permissive RLS policy
        working-directory: /tmp/fixora-db-ci
        shell: bash
        run: |
          set -euo pipefail
          database_url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          run_mutation() {
            policy_name="$1"
            table_name="$2"
            expected_failure="$3"
            log_file="/tmp/${policy_name}.log"
            psql "$database_url" -v ON_ERROR_STOP=1 -c "CREATE POLICY \"${policy_name}\" ON public.${table_name} FOR SELECT TO authenticated USING (true)"
            set +e
            supabase test db > "$log_file" 2>&1
            test_status=$?
            set -e
            psql "$database_url" -v ON_ERROR_STOP=1 -c "DROP POLICY IF EXISTS \"${policy_name}\" ON public.${table_name}"
            if [ "$test_status" -eq 0 ]; then
              cat "$log_file"
              echo "Mutation was not detected for public.${table_name}."
              exit 1
            fi
            if ! grep -Fq "$expected_failure" "$log_file"; then
              cat "$log_file"
              echo "The expected isolation assertion did not fail for public.${table_name}."
              exit 1
            fi
            echo "RLS mutation detected for public.${table_name}: $expected_failure"
          }
          run_mutation fixora_ci_mutation_business_allow_all fixora_businesses "User B cannot see User A business"
          run_mutation fixora_ci_mutation_catalog_allow_all fixora_catalog_items "User B sees only their catalog row"
          run_mutation fixora_ci_mutation_support_ticket_allow_all fixora_support_tickets "Customer B can see Customer A ticket"
          run_mutation fixora_ci_mutation_support_message_allow_all fixora_support_messages "Customer B can see Customer A messages"
          supabase test db

      - name: Test concurrent license device activation limit
        run: bash scripts/test-license-concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
