name: Database tests

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"

permissions:
  contents: read

concurrency:
  group: fixora-db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Prepare isolated local Supabase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fixora-db-ci
          cd /tmp/fixora-db-ci
          supabase init
          cp -R "$GITHUB_WORKSPACE/supabase/migrations" supabase/
          cp -R "$GITHUB_WORKSPACE/supabase/tests" supabase/

      - name: Start isolated local Supabase stack
        working-directory: /tmp/fixora-db-ci
        run: supabase start

      - name: Rebuild database from committed migrations
        working-directory: /tmp/fixora-db-ci
        run: supabase db reset

      - name: Run pgTAP database tests
        working-directory: /tmp/fixora-db-ci
        run: supabase test db
