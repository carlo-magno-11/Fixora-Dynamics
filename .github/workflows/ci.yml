name: CI
on:
  pull_request:
  push:
    branches: [main, 'foundation/**', 'security/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: denoland/setup-deno@4606d5cc6fb3f673efd4f594850e3f4b3e9d29cd # v2.0.0
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: deno check supabase/functions/activate-license/index.ts supabase/functions/admin-verify-etsy-purchase/index.ts supabase/functions/admin-reissue-activation-code/index.ts supabase/functions/admin-revoke-device/index.ts supabase/functions/admin-support-reply/index.ts supabase/functions/admin-create-invite/index.ts supabase/functions/admin-accept-invite/index.ts supabase/functions/admin-console/index.ts supabase/functions/admin-support-inbox/index.ts
      - name: Test Edge Function utilities
        run: deno test supabase/functions/_shared/crypto.test.ts supabase/functions/_shared/http.test.ts supabase/functions/_shared/rate-limit.test.ts
