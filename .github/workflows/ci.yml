name: CI
on:
  pull_request:
  push:
    branches: [main, 'foundation/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: deno check supabase/functions/activate-license/index.ts supabase/functions/admin-verify-etsy-purchase/index.ts
      - name: Test Edge Function utilities
        run: deno test supabase/functions/_shared/crypto.test.ts
