name: Generate migration filename
on:
  pull_request:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Generate filename using Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fixora-migration-name
          cd /tmp/fixora-migration-name
          supabase init
          supabase migration new fixora_operational_data
          find supabase/migrations -maxdepth 1 -type f -name '*_fixora_operational_data.sql' -print
