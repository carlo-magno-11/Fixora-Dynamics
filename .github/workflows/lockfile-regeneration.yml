name: Temporary lockfile regeneration

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/lockfile-regeneration.yml

permissions:
  contents: read

jobs:
  regenerate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'carlo-magno-11' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Regenerate and commit lockfile
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          current_sha="$(gh api "/repos/${REPOSITORY}/contents/pnpm-lock.yaml?ref=${BRANCH}" --jq .sha)"
          content="$(base64 -w0 pnpm-lock.yaml)"
          gh api --method PUT "/repos/${REPOSITORY}/contents/pnpm-lock.yaml" \
            -f message="fix(deps): refresh pnpm lockfile for patched Vite and Vitest" \
            -f content="${content}" \
            -f sha="${current_sha}" \
            -f branch="${BRANCH}" >/dev/null
          echo "Committed the regenerated lockfile to the owned security branch."
