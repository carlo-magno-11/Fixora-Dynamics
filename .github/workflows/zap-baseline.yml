name: Staging DAST (ZAP baseline)

on:
  workflow_dispatch:
  schedule:
    - cron: "41 10 * * 3"

permissions:
  contents: read

jobs:
  zap-baseline:
    name: Passive web scan (staging only)
    if: ${{ vars.FIXORA_STAGING_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Validate staging target
        env:
          TARGET: ${{ vars.FIXORA_STAGING_URL }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            https://*) ;;
            *) echo "::error::FIXORA_STAGING_URL must be an HTTPS staging URL."; exit 1 ;;
          esac
          case "$TARGET" in
            *localhost*|*127.0.0.1*|*supabase.co*|*github.com*)
              echo "::error::Target is not an approved Fixora staging hostname."
              exit 1
              ;;
          esac
          printf '%s\n' "$TARGET" > /tmp/fixora-zap-target.txt
      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.FIXORA_STAGING_URL }}
          allow_issue_writing: false
          fail_action: false
