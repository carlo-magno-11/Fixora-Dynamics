name: Browser E2E

on:
  pull_request:
  push:
    branches:
      - main
      - "foundation/**"
      - "security/**"
      - "integration/**"

permissions:
  contents: read

concurrency:
  group: fixora-browser-e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Auth and tenant isolation in local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 2.122.0

      - name: Start isolated local Supabase
        run: |
          set -euo pipefail
          supabase start
          supabase db reset
          supabase status -o env > /tmp/fixora-supabase.env

      - name: Install app and pinned browser test dependencies
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build cloud-mode application against local Supabase
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source /tmp/fixora-supabase.env
          set +a
          export VITE_FIXORA_AUTH_MODE=cloud
          export VITE_SUPABASE_URL="$API_URL"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          npm run build
          echo "FIXORA_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "FIXORA_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "FIXORA_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Run browser E2E
        run: npx playwright test
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
