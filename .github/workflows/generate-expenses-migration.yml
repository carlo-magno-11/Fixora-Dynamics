name: Generate Fixora expenses RPC migration
on:
  push:
    branches: [feat/web-auth-cloud-20261102]
    paths:
      - .github/workflows/generate-expenses-migration.yml
permissions:
  contents: write
jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/web-auth-cloud-20261102
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Generate migration through Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new fixora_save_expenses_batch_rpc
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_fixora_save_expenses_batch_rpc.sql' -print -quit)"
          test -n "$migration_file"
          cat > "$migration_file" <<'SQL'
create or replace function public.fixora_save_expenses(
  p_business_id uuid,
  p_expected_units numeric,
  p_period text,
  p_expected_version bigint,
  p_fixed jsonb,
  p_variable jsonb
)
returns bigint
language plpgsql
security invoker
set search_path = ''
as $$
declare
  v_item jsonb;
  v_id uuid;
  v_id_text text;
  v_name text;
  v_amount numeric;
  v_seen_ids uuid[] := array[]::uuid[];
  v_new_version bigint;
begin
  if auth.uid() is null then
    raise exception 'Authentication is required'
      using errcode = '42501';
  end if;

  if p_business_id is null
    or p_expected_version is null
    or p_expected_version < 1
    or p_expected_units is null
    or p_expected_units <= 0
    or p_expected_units::text in ('NaN', 'Infinity', '-Infinity')
    or p_period not in ('week', 'month', 'quarter', 'year')
    or p_fixed is null
    or jsonb_typeof(p_fixed) <> 'array'
    or p_variable is null
    or jsonb_typeof(p_variable) <> 'array'
    or jsonb_array_length(p_fixed) > 100
    or jsonb_array_length(p_variable) > 100
  then
    raise exception 'Invalid expense settings or payload'
      using errcode = '22023';
  end if;

  if not (select fixora_private.has_active_business_role(
    p_business_id, array['owner', 'admin', 'editor']::text[]
  )) then
    raise exception 'You cannot edit expenses for this business'
      using errcode = '42501';
  end if;

  for v_item in select value from jsonb_array_elements(p_fixed)
  loop
    if jsonb_typeof(v_item) <> 'object' then
      raise exception 'Each fixed expense must be an object'
        using errcode = '22023';
    end if;
    v_name := pg_catalog.btrim(coalesce(v_item ->> 'name', ''));
    if pg_catalog.char_length(v_name) not between 1 and 120 then
      raise exception 'Expense name must contain between 1 and 120 characters'
        using errcode = '22023';
    end if;
    begin
      v_amount := (v_item ->> 'amount')::numeric;
    exception when others then
      raise exception 'Expense amount must be a valid number'
        using errcode = '22023';
    end;
    if v_amount is null or v_amount < 0
      or v_amount::text in ('NaN', 'Infinity', '-Infinity')
    then
      raise exception 'Expense amount must be finite and non-negative'
        using errcode = '22023';
    end if;
    v_id_text := nullif(v_item ->> 'id', '');
    if v_id_text is not null then
      begin
        v_id := v_id_text::uuid;
      exception when others then
        raise exception 'Expense id must be a UUID'
          using errcode = '22023';
      end;
      if v_id = any(v_seen_ids) then
        raise exception 'An expense id was submitted more than once'
          using errcode = '22023';
      end if;
      v_seen_ids := pg_catalog.array_append(v_seen_ids, v_id);
    end if;
  end loop;

  for v_item in select value from jsonb_array_elements(p_variable)
  loop
    if jsonb_typeof(v_item) <> 'object' then
      raise exception 'Each variable expense must be an object'
        using errcode = '22023';
    end if;
    v_name := pg_catalog.btrim(coalesce(v_item ->> 'name', ''));
    if pg_catalog.char_length(v_name) not between 1 and 120 then
      raise exception 'Expense name must contain between 1 and 120 characters'
        using errcode = '22023';
    end if;
    begin
      v_amount := (v_item ->> 'amount')::numeric;
    exception when others then
      raise exception 'Expense amount must be a valid number'
        using errcode = '22023';
    end;
    if v_amount is null or v_amount < 0
      or v_amount::text in ('NaN', 'Infinity', '-Infinity')
    then
      raise exception 'Expense amount must be finite and non-negative'
        using errcode = '22023';
    end if;
    v_id_text := nullif(v_item ->> 'id', '');
    if v_id_text is not null then
      begin
        v_id := v_id_text::uuid;
      exception when others then
        raise exception 'Expense id must be a UUID'
          using errcode = '22023';
      end;
      if v_id = any(v_seen_ids) then
        raise exception 'An expense id was submitted more than once'
          using errcode = '22023';
      end if;
      v_seen_ids := pg_catalog.array_append(v_seen_ids, v_id);
    end if;
  end loop;

  update public.fixora_expense_settings
  set expected_units = p_expected_units,
      period = p_period,
      version = version + 1
  where business_id = p_business_id
    and version = p_expected_version
  returning version into v_new_version;

  if v_new_version is null then
    raise exception 'Expense settings changed. Reload before saving.'
      using errcode = '40001';
  end if;

  update public.fixora_expenses as expense
  set is_active = false
  where expense.business_id = p_business_id
    and expense.expense_type = 'fixed'
    and expense.is_active
    and not exists (
      select 1
      from jsonb_array_elements(p_fixed) as item(value)
      where nullif(item.value ->> 'id', '') is not null
        and (item.value ->> 'id')::uuid = expense.id
    );

  update public.fixora_expenses as expense
  set is_active = false
  where expense.business_id = p_business_id
    and expense.expense_type = 'variable'
    and expense.is_active
    and not exists (
      select 1
      from jsonb_array_elements(p_variable) as item(value)
      where nullif(item.value ->> 'id', '') is not null
        and (item.value ->> 'id')::uuid = expense.id
    );

  for v_item in select value from jsonb_array_elements(p_fixed)
  loop
    v_id_text := nullif(v_item ->> 'id', '');
    v_name := pg_catalog.btrim(v_item ->> 'name');
    v_amount := (v_item ->> 'amount')::numeric;
    if v_id_text is null then
      insert into public.fixora_expenses (business_id, expense_type, name, amount)
      values (p_business_id, 'fixed', v_name, v_amount);
    else
      v_id := v_id_text::uuid;
      update public.fixora_expenses
      set name = v_name, amount = v_amount, is_active = true
      where id = v_id
        and business_id = p_business_id
        and expense_type = 'fixed';
      if not found then
        raise exception 'Fixed expense does not belong to this business'
          using errcode = '42501';
      end if;
    end if;
  end loop;

  for v_item in select value from jsonb_array_elements(p_variable)
  loop
    v_id_text := nullif(v_item ->> 'id', '');
    v_name := pg_catalog.btrim(v_item ->> 'name');
    v_amount := (v_item ->> 'amount')::numeric;
    if v_id_text is null then
      insert into public.fixora_expenses (business_id, expense_type, name, amount)
      values (p_business_id, 'variable', v_name, v_amount);
    else
      v_id := v_id_text::uuid;
      update public.fixora_expenses
      set name = v_name, amount = v_amount, is_active = true
      where id = v_id
        and business_id = p_business_id
        and expense_type = 'variable';
      if not found then
        raise exception 'Variable expense does not belong to this business'
          using errcode = '42501';
      end if;
    end if;
  end loop;

  return v_new_version;
end;
$$;

revoke all on function public.fixora_save_expenses(uuid, numeric, text, bigint, jsonb, jsonb)
  from public, anon;
grant execute on function public.fixora_save_expenses(uuid, numeric, text, bigint, jsonb, jsonb)
  to authenticated;
SQL
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$migration_file"
          git commit -m "feat(db): add atomic cloud expense save RPC"
          git push origin HEAD:feat/web-auth-cloud-20261102
