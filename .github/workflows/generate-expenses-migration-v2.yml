name: Generate Fixora expenses RPC migration
on:
  push:
    branches: [feat/web-auth-cloud-20261102]
    paths:
      - .github/workflows/generate-expenses-migration-v2.yml
permissions:
  contents: write
jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/web-auth-cloud-20261102
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Generate and commit migration
        run: bash scripts/generate-expenses-migration.sh
